<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사용 대시보드 - 제로 콜라와 혈당</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .group-card {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 5px solid #3498db;
        }
        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .group-card.rejected {
            border-top: 5px solid #e74c3c;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.hidden {
            display: none !important;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 1000px; 
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            border-radius: 24px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 25px; right: 25px;
            font-size: 24px;
            background: none; border: none; cursor: pointer; color: #7f8c8d;
        }
        .data-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        /* 탭 버튼 스타일 */
        .tab-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            margin-bottom: 25px;
        }
        .tab-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            background-color: #e2e8f0;
            color: #4a5568;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #3498db;
            color: white;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.25);
        }
        .modal-nav-btn {
            background: none;
            border: 2px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #4a5568;
            transition: all 0.2s;
            font-size: 15px;
        }
        .modal-nav-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e0;
        }
        .modal-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .modal-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 15px;
        }
    </style>
</head>
<body style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <header>
        <h1>실시간 탐구 현황 대시보드</h1>
        <div style="font-size: 15px; color: #7f8c8d;">조별로 최신 제출본이 정렬되어 표시됩니다.</div>
    </header>

    <!-- 1차시 / 2차시 / 형성 평가 탭 분리 -->
    <div class="tab-container">
        <button id="tab-phase1" class="tab-btn active">1차시: 탐구 설계 (가설)</button>
        <button id="tab-phase2" class="tab-btn">2차시: 최종 보고서</button>
        <!-- 아래 줄이 추가되었습니다 -->
        <button id="tab-learning" class="tab-btn" style="border: 2px solid #27ae60; color: #27ae60; background: #fff;">💡 형성 평가 모아보기</button>
    </div>

    <div id="dashboard-grid" class="dashboard-grid">
        <!-- 카드가 생성되는 영역 -->
    </div>

    <!-- 상세 보기 팝업 창 -->
    <!-- 상세 보기 팝업 창 -->
    <!-- 상세 보기 팝업 창 -->
    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">✖</button>
            
            <!-- 상단 네비게이션 헤더 추가 -->
            <div class="modal-header">
                <button id="modal-prev-btn" class="modal-nav-btn">◀ 이전 조</button>
                <h2 id="modal-title" style="margin: 0; color: #2c3e50;">조 상세 결과</h2>
                <button id="modal-next-btn" class="modal-nav-btn">다음 조 ▶</button>
            </div>
            
            <!-- 공통 영역 (가설/결론) -->
            <div class="data-box">
                <h3 id="modal-conclusion-title" style="margin-top: 0;">내용</h3>
                <p id="modal-conclusion" style="font-size: 16px; line-height: 1.6; margin-bottom: 0;"></p>
            </div>

            <!-- 1차시에만 보여줄 실험 조건 영역 -->
            <div id="modal-phase1-content" class="data-box" style="display: none; background: #f0fdf4; border-left: 4px solid #2ecc71;">
                <h3 style="margin-top: 0; color: #27ae60;">설정된 실험 조건</h3>
                <table style="width: 100%; border-collapse: collapse; font-size: 15px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                    <thead>
                        <tr style="border-bottom: 2px solid #bceac5; background: #e8f8f5; color: #2c3e50;">
                            <th style="text-align: left; padding: 12px 15px;">변인 (구분)</th>
                            <th style="padding: 12px 15px; text-align: center; width: 30%;">대조군 (기준)</th>
                            <th style="padding: 12px 15px; text-align: center; width: 30%;">실험군 (비교)</th>
                        </tr>
                    </thead>
                    <tbody id="modal-vars-tbody">
                        <!-- 자바스크립트로 데이터가 삽입됨 -->
                    </tbody>
                </table>
            </div>

           <!-- 2차시에만 보여줄 영역 -->
            <div id="modal-phase2-content">
                <!-- 추가된 최종 결론 영역 -->
                <div class="data-box">
                    <h3 style="margin-top: 0; color: #2980b9;">최종 결론</h3>
                    <p id="modal-phase2-conclusion" style="font-size: 16px; line-height: 1.6; margin-bottom: 0; font-weight: bold;"></p>
                </div>

                <div class="data-box">
                    <h3 style="margin-top: 0;">가설 검증</h3>
                    <p id="modal-validation" style="font-size: 16px; margin-bottom: 0;"></p>
                </div>

                <h3>자료 해석 및 그래프</h3>
                <p id="modal-analysis" style="background: #fffbeb; padding: 15px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #f59e0b;"></p>
                
                <div class="chart-container">
                    <canvas id="modalChart"></canvas>
                </div>

                <div class="data-box" style="margin-top: 20px;">
                    <h3 style="margin-top: 0;">새롭게 알게 된 점 및 오차 논의</h3>
                    <p><strong>오차 논의:</strong> <span id="modal-error"></span></p>
                    <p><strong>새롭게 알게 된 점:</strong> <span id="modal-learning"></span></p>
                </div>
            </div>
            <!-- 교사 피드백 전송 영역 (모든 차시에 공통 표시) -->
            <div class="data-box" style="margin-top: 25px; background: #e8f4fd; border-left: 4px solid #3498db;">
                <h3 style="margin-top: 0; color: #2980b9;">💬 이 조에 실시간 피드백 보내기</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="feedback-input" placeholder="학생 화면에 띄울 피드백 내용을 입력하세요..." style="flex: 1; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 15px; font-family: inherit;">
                    <button id="send-feedback-btn" class="primary-btn" style="width: auto; padding: 0 25px; margin-top: 0; background-color: #2980b9;">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="teacher.js"></script>
</body>
</html>
