<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사용 대시보드 - 과학 탐구 프로젝트</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="teacher.css">
</head>
<body class="teacher">

<!-- 로그인 -->
<div id="login-view" class="login-view">
    <form class="login-card" onsubmit="event.preventDefault(); login();">
        <h1>👩‍🏫 교사용 대시보드</h1>
        <p class="lead">Supabase에 등록한 교사 계정으로 로그인하세요.</p>
        <label class="field"><span>이메일</span><input type="email" id="login-email" autocomplete="username" required></label>
        <label class="field"><span>비밀번호</span><input type="password" id="login-password" autocomplete="current-password" required></label>
        <p id="login-msg" class="intro-msg"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">로그인</button>
    </form>
</div>

<!-- 대시보드 -->
<div id="dash-view" hidden>
    <header class="dash-header">
        <div class="dash-title">
            <h1>실시간 탐구 현황</h1>
            <span id="live-dot" class="live-dot" title="실시간 연결 상태">● 실시간</span>
            <button class="code-chip" id="code-chip" onclick="openLinkModal()" title="학생 입장 링크·QR 보기">🔗 수업 코드 <b id="my-code"></b></button>
        </div>
        <div class="dash-filters">
            <select id="filter-grade" onchange="onFilterChange()"></select>
            <select id="filter-class" onchange="onFilterChange()"></select>
            <button class="btn btn-small btn-ghost" onclick="openModal('broadcast-modal')">📢 전체 공지</button>
            <button class="btn btn-small btn-ghost" onclick="openManage()">⚙️ 모둠 관리</button>
            <button class="link-btn" onclick="logout()">로그아웃</button>
        </div>
    </header>

    <div class="dash-stats" id="dash-stats"></div>
    <div id="grid-container" class="card-grid"></div>
    <p id="grid-empty" class="hint center" hidden></p>
</div>

<!-- 모둠 상세 (신문 전체 보기 + 피드백) -->
<div id="detail-view" class="detail-view" hidden>
    <div class="detail-top">
        <div class="detail-nav">
            <button class="btn btn-small btn-ghost" onclick="moveDetail(-1)">◀ 이전 모둠</button>
            <button class="btn btn-small btn-ghost" onclick="moveDetail(1)">다음 모둠 ▶</button>
        </div>
        <div class="detail-title">
            <h2 id="detail-team"></h2>
            <span id="detail-sub" class="muted"></span>
        </div>
        <div class="detail-actions">
            <button class="btn btn-small btn-ghost" onclick="toggleBigText()" title="토의할 때 화면에 크게 띄우기">🔍 크게 보기</button>
            <button class="btn btn-small btn-ghost danger" onclick="resetTeam()">초기화</button>
            <button class="icon-btn close-detail" onclick="closeDetail()" aria-label="닫기">✕</button>
        </div>
    </div>
    <div class="detail-body">
        <article id="detail-report" class="report"></article>
        <aside class="detail-feedback">
            <h3>💬 피드백 보내기</h3>
            <div id="detail-feedback-list" class="feedback-list"></div>
            <textarea id="teacher-comment" rows="3" placeholder="가설의 논리성, 그래프 선택의 적절성 등에 대해 피드백을 남겨 주세요."></textarea>
            <div class="quick-feedback" id="quick-feedback"></div>
            <button class="btn btn-primary btn-block" onclick="sendFeedback()">학생 화면으로 보내기 🚀</button>
        </aside>
    </div>
</div>

<!-- 모둠 관리 -->
<div id="manage-modal" class="modal" hidden>
    <div class="modal-content">
        <button class="icon-btn modal-close" onclick="closeModal('manage-modal')" aria-label="닫기">✕</button>
        <h2>⚙️ 모둠 관리</h2>
        <h3>모둠 만들기</h3>
        <p class="hint">학년·반과 모둠 수를 정하면 1조부터 차례로 만들어요. 이미 있는 모둠은 그대로 둡니다.</p>
        <div class="manage-form">
            <label class="field"><span>학년</span><input type="number" id="new-grade" min="1" max="6" value="1"></label>
            <label class="field"><span>반</span><input type="number" id="new-class" min="1" max="30" value="1"></label>
            <label class="field"><span>모둠 수</span><input type="number" id="new-count" min="1" max="20" value="6"></label>
        </div>
        <button class="btn btn-primary btn-block" onclick="createTeams()">모둠 만들기</button>
        <h3 class="section-title">만든 반 목록</h3>
        <div id="class-list" class="class-list"></div>
    </div>
</div>

<!-- 학생 입장 링크 · QR -->
<div id="link-modal" class="modal" hidden>
    <div class="modal-content link-content">
        <button class="icon-btn modal-close" onclick="closeModal('link-modal')" aria-label="닫기">✕</button>
        <h2>🔗 학생 입장 링크</h2>
        <p class="hint center">학생이 이 링크나 QR로 들어오면 선생님의 반만 보여요.</p>
        <div class="link-code" id="link-code"></div>
        <div class="link-qr" id="link-qr"></div>
        <div class="link-row">
            <input type="text" id="link-url" readonly onclick="this.select()">
            <button class="btn btn-small btn-primary" onclick="copyLink()">복사</button>
        </div>
        <div class="link-actions">
            <button class="btn btn-small btn-ghost" onclick="toggleLinkBig()">🔍 크게 보기 (화면에 띄우기)</button>
            <button class="btn btn-small btn-ghost" onclick="downloadQR()">⬇️ QR 이미지 저장</button>
        </div>
        <h3 class="section-title">선생님 표시 이름</h3>
        <p class="hint">학생 입장 화면에 "○○ 선생님의 수업"으로 보여요.</p>
        <div class="link-row">
            <input type="text" id="teacher-name-input" maxlength="30" placeholder="예: 김탐구">
            <button class="btn btn-small btn-ghost" onclick="saveTeacherName()">저장</button>
        </div>
    </div>
</div>

<!-- 전체 공지 -->
<div id="broadcast-modal" class="modal" hidden>
    <div class="modal-content">
        <button class="icon-btn modal-close" onclick="closeModal('broadcast-modal')" aria-label="닫기">✕</button>
        <h2>📢 전체 공지</h2>
        <p class="hint" id="broadcast-target"></p>
        <textarea id="broadcast-text" rows="4" placeholder="예: 5분 뒤에 상호 토의를 시작합니다. 그래프를 마무리해 주세요!"></textarea>
        <button class="btn btn-primary btn-block" onclick="sendBroadcast()">보내기</button>
    </div>
</div>

<div id="toast-area" class="toast-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="themes.js"></script>
<script src="common.js"></script>
<script src="teacher.js"></script>
</body>
</html>
